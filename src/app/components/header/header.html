<header class="fixed top-4 left-0 right-0 z-50 px-4 md:px-8 max-w-7xl mx-auto header-glow ">
  <div class="glass-panel rounded-2xl px-6 py-4 flex items-center justify-between transition-all duration-300">
    <!-- Logo -->
    <a href="#" class="flex items-center gap-2 group font-semibold text-lg tracking-tight">
      <div
        class="w-8 h-8 rounded-lg bg-gradient-to-tr from-primary to-secondary flex items-center justify-center text-white font-bold shadow-md shadow-primary/20">
        P
      </div>
      <span
        class="bg-gradient-to-r from-white to-gray-400 bg-clip-text text-transparent group-hover:from-primary group-hover:to-secondary transition-all duration-300">
        Pham Tran Nhat Minh
      </span>
    </a>

    <!-- Desktop Navigation -->
    <nav class="hidden md:flex items-center gap-8">
      <a href="#overview"
        class="text-sm font-medium text-gray-400 hover:text-white hover:text-glow-primary transition-all duration-300">Overview</a>
      <a href="#repos"
        class="text-sm font-medium text-gray-400 hover:text-white hover:text-glow-primary transition-all duration-300">Repositories</a>
      <a href="#learning"
        class="text-sm font-medium text-gray-400 hover:text-white hover:text-glow-secondary transition-all duration-300">Learning</a>
      <a href="#contact"
        class="px-4 py-2 text-sm font-semibold rounded-xl bg-gradient-to-r from-primary to-secondary text-white shadow-lg shadow-primary/20 hover:shadow-secondary/30 active:scale-[0.97] transition-all duration-300">
        Get in touch
      </a>
    </nav>

    <!-- Mobile menu button -->
    <button (click)="toggleMenu()"
      class="md:hidden p-2 rounded-lg text-gray-400 hover:text-white focus:outline-none focus:ring-2 focus:ring-primary/45 transition-colors">
      <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        @if (!menuOpen()) {
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
        } @else {
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        }
      </svg>
    </button>
  </div>

  <!-- Mobile Dropdown Menu -->
  @if (menuOpen()) {
  <div class="md:hidden mt-2 p-4 rounded-2xl glass-panel flex flex-col gap-4 animate-fadeIn">
    <a href="#overview" (click)="toggleMenu()"
      class="text-base font-medium text-gray-300 hover:text-white px-2 py-1.5 rounded-lg hover:bg-white/5 transition-all">Overview</a>
    <a href="#repos" (click)="toggleMenu()"
      class="text-base font-medium text-gray-300 hover:text-white px-2 py-1.5 rounded-lg hover:bg-white/5 transition-all">Repositories</a>
    <a href="#learning" (click)="toggleMenu()"
      class="text-base font-medium text-gray-300 hover:text-white px-2 py-1.5 rounded-lg hover:bg-white/5 transition-all">Learning</a>
    <a href="#contact" (click)="toggleMenu()"
      class="mt-2 w-full py-3 text-center text-sm font-semibold rounded-xl bg-gradient-to-r from-primary to-secondary text-white shadow-lg shadow-primary/20 active:scale-[0.97] transition-all">
      Get in touch
    </a>
  </div>
  }
</header>
